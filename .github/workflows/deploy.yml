name: Admin Deploy to VPS

# The admin.smholdings.gr panel (Next.js standalone). Same deploy shape as
# the smholdings site and lincanto: build on a hosted runner, push to ghcr,
# then the box runs the blue/green script over SSH — deploy-admin.sh on the
# VPS is a copy of this repo's file; it is the source of truth, so when it
# changes, copy it to /root/ again.
#
# NEXT_PUBLIC_* are inlined by `pnpm build` — the build args below are the
# only place they come from (there is no committed prod env file).
#
# One branch, one host: `main` deploys admin.smholdings.gr. The deploy colour
# comes from the run number (odd=green, even=blue). The host-side deploy lock
# serialises with the site/lincanto/API deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployment-admin
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SITE_DOMAIN: admin.smholdings.gr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.smholdings.gr/api
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_API_KEY=${{ vars.CLOUDINARY_API_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Determine deploy color
        id: color
        run: |
          if [ $((${{ github.run_number }} % 2)) -eq 0 ]; then
            echo "color=blue" >> $GITHUB_OUTPUT
          else
            echo "color=green" >> $GITHUB_OUTPUT
          fi

      - name: Blue-green deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_USERNAME,IMAGE,DEPLOY_COLOR
          script: |
            export GITHUB_USERNAME=${{ github.actor }}
            export DEPLOY_COLOR=${{ steps.color.outputs.color }}
            export IMAGE=$(echo "ghcr.io/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
            export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            /root/deploy-admin.sh "$DEPLOY_COLOR" "$IMAGE"

      # Smoke test through the VPS edge regardless of where DNS points:
      # --resolve pins the host to the box, -k because the ACME cert may not
      # exist yet on the first runs. -f fails on 4xx/5xx.
      - name: Smoke test through Traefik
        run: |
          curl -fsSk --resolve "${{ env.SITE_DOMAIN }}:443:${{ secrets.VPS_HOST }}" \
            "https://${{ env.SITE_DOMAIN }}/login" -o /dev/null
